[project]
name = "histnet"
version = "1.0.1"
description = "Feasibility demonstration: routable historical road networks read from old map sheets, with population, for one corridor in western Sweden"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "geopandas>=1.0",
  "shapely>=2.0",
  "pyproj>=3.6",
  "rasterio>=1.3",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scipy>=1.12",
  "networkx>=3.2",
  "matplotlib>=3.8",
  "pillow>=10",
  "rdata>=0.11",
  "requests>=2.31",
  "pyogrio>=0.7",
  "hierx==0.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
report = ["markdown>=3.5", "weasyprint>=62"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
